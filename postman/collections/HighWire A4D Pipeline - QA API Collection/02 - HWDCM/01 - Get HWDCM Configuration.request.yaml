$kind: http-request
url: "{{hwdcm_base_url}}/config"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Configuration endpoint returns HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Configuration contains expected local settings', function () {
          const body = pm.response.text();
          pm.expect(body).to.include('atom.drupal');
          pm.expect(body).to.include('false');
      });
    language: text/javascript
order: 1000
