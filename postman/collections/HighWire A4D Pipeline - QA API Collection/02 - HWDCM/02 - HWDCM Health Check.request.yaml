$kind: http-request
url: "{{hwdcm_base_url}}/actuator/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Health endpoint returns HTTP 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Health status is UP', function () {
          pm.expect(pm.response.json().status).to.eql('UP');
      });
    language: text/javascript
order: 2000
